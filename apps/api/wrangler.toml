name = "jansetu-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "development"
LOG_LEVEL = "info"
CORS_ORIGIN = "http://localhost:5173,http://localhost:3000"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "jansetu-media"
