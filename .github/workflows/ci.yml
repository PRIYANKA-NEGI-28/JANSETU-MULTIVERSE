name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python IoT Dependencies
        run: uv pip install --system pytest httpx pydantic pytest-asyncio python-dotenv

      - name: Lint Workspace
        run: pnpm lint

      - name: Typecheck Workspace
        run: pnpm typecheck

      - name: Run JavaScript/TypeScript Unit & Integration Tests
        run: pnpm test

      - name: Run IoT Telemetry & Hardware Python Tests
        run: pytest iot/python

      - name: Build Web Application
        run: pnpm --filter @jansetu/web build

      - name: Build Backend API
        run: pnpm --filter @jansetu/api build

      - name: Generate Web Bundle Size Report
        run: node scripts/bundle-size-report.mjs

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

  e2e:
    name: Playwright Full-Stack E2E Journeys
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm dlx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright Test Report Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
